# Codex CLI — project-level config
# See: https://github.com/openai/codex/blob/main/docs/config.md

model = "gpt-5-codex"
approval_policy = "on-request"

# Read AGENTS.md (plus CLAUDE.md / GEMINI.md as fallbacks) for project context.
project_doc_max_bytes = 32768
project_doc_fallback_filenames = ["CLAUDE.md", "GEMINI.md"]

# Prompts live in ~/.codex/prompts/ (user scope).
# Run `./.unicli-rules/sync.sh --install-codex-prompts` to install them with the
# prefix `unicli-` so slash commands like /unicli-researcher become available.

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.aws-docs]
command = "npx"
args = ["-y", "@aws/aws-documentation-mcp-server"]

[mcp_servers.tavily-search]
command = "npx"
args = ["-y", "tavily-mcp@latest"]
env_vars = ["TAVILY_API_KEY"]

[mcp_servers.tavily-search.env]
TAVILY_API_KEY = "${TAVILY_API_KEY}"

[mcp_servers.mcp-atlassian]
command = "uvx"
args = ["mcp-atlassian"]
env_vars = ["ATLASSIAN_API_TOKEN", "ATLASSIAN_URL", "ATLASSIAN_USER_EMAIL"]

[mcp_servers.mcp-atlassian.env]
ATLASSIAN_URL = "${ATLASSIAN_URL}"
ATLASSIAN_USER_EMAIL = "${ATLASSIAN_USER_EMAIL}"
ATLASSIAN_API_TOKEN = "${ATLASSIAN_API_TOKEN}"

# MCP servers — generated by render_mcp.py, do not edit directly
[[mcpServers]]
name = "aws-core"
command = "uvx"
args = ["awslabs.core-mcp-server@latest"]
[mcpServers.env]  # last table — must follow scalar keys
FASTMCP_LOG_LEVEL = "ERROR"

[[mcpServers]]
name = "aws-docs"
command = "uvx"
args = ["awslabs.aws-documentation-mcp-server@latest"]
[mcpServers.env]  # last table — must follow scalar keys
AWS_DOCUMENTATION_PARTITION = "aws"
FASTMCP_LOG_LEVEL = "ERROR"

[[mcpServers]]
name = "aws-iam"
command = "uvx"
args = ["awslabs.iam-mcp-server@latest"]
[mcpServers.env]  # last table — must follow scalar keys
AWS_PROFILE = "${AWS_PROFILE}"
AWS_REGION = "ap-northeast-2"
FASTMCP_LOG_LEVEL = "ERROR"

[[mcpServers]]
name = "aws-iac"
command = "uvx"
args = ["awslabs.aws-iac-mcp-server@latest"]
[mcpServers.env]  # last table — must follow scalar keys
AWS_PROFILE = "${AWS_PROFILE}"
AWS_REGION = "ap-northeast-2"
FASTMCP_LOG_LEVEL = "ERROR"

[[mcpServers]]
name = "aws-eks"
command = "uvx"
args = ["awslabs.eks-mcp-server@latest"]
[mcpServers.env]  # last table — must follow scalar keys
AWS_PROFILE = "${AWS_PROFILE}"
AWS_REGION = "ap-northeast-2"
FASTMCP_LOG_LEVEL = "ERROR"

[[mcpServers]]
name = "aws-cloudwatch"
command = "uvx"
args = ["awslabs.cloudwatch-mcp-server@latest"]
[mcpServers.env]  # last table — must follow scalar keys
AWS_PROFILE = "${AWS_PROFILE}"
AWS_REGION = "ap-northeast-2"
FASTMCP_LOG_LEVEL = "ERROR"

[[mcpServers]]
name = "tavily"
command = "npx"
args = ["-y", "mcp-remote", "https://mcp.tavily.com/mcp/", "--header", "Authorization:Bearer ${TAVILY_API_KEY}"]
[mcpServers.env]  # last table — must follow scalar keys
TAVILY_API_KEY = "${TAVILY_API_KEY}"

[[mcpServers]]
name = "playwright"
command = "npx"
args = ["@playwright/mcp@latest", "--isolated"]
[mcpServers.env]  # last table — must follow scalar keys
PLAYWRIGHT_MCP_ISOLATED = "true"

[[mcpServers]]
name = "mcp-atlassian"
command = "uvx"
args = ["mcp-atlassian"]
[mcpServers.env]  # last table — must follow scalar keys
JIRA_URL = "${JIRA_URL}"
JIRA_PERSONAL_TOKEN = "${JIRA_PERSONAL_TOKEN}"
CONFLUENCE_URL = "${CONFLUENCE_URL}"
CONFLUENCE_PERSONAL_TOKEN = "${CONFLUENCE_PERSONAL_TOKEN}"

[[mcpServers]]
name = "atom-tmf-kb-mcp"
command = "uv"
args = ["run", "--directory", "/Users/1111207/atom-tmf-kb-mcp", "python", "-m", "tmf_kb_mcp"]

[[mcpServers]]
name = "serena"
command = "serena"
args = ["start-mcp-server", "--context=claude-code", "--project-from-cwd"]

[[mcpServers]]
name = "gitlab"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-gitlab"]
[mcpServers.env]  # last table — must follow scalar keys
GITLAB_PERSONAL_ACCESS_TOKEN = "${GITLAB_PERSONAL_ACCESS_TOKEN}"
GITLAB_API_URL = "${GITLAB_API_URL}"
NODE_TLS_REJECT_UNAUTHORIZED = "0"
